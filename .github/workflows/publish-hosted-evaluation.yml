name: Publish PERL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify the product build
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Stage pinned Mozilla PDF.js runtime
        run: npm install --no-save --package-lock=false --ignore-scripts pdfjs-dist@6.2.108
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble private browser product
        run: |
          mkdir -p _site
          cp index.html app.js *.css *.js _site/
          cp -R assets src _site/
          mkdir -p _site/vendor
          cp node_modules/pdfjs-dist/build/pdf.min.mjs _site/vendor/
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs _site/vendor/
          cp -R node_modules/pdfjs-dist/cmaps _site/vendor/
          cp -R node_modules/pdfjs-dist/standard_fonts _site/vendor/
          cp node_modules/pdfjs-dist/LICENSE _site/vendor/PDFJS-LICENSE.txt
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
