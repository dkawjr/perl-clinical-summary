name: Publish private deployment candidate

on:
  workflow_dispatch:
    inputs:
      node_image:
        description: Approved digest-pinned Node base image
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require immutable base image
        env:
          PERL_NODE_IMAGE: ${{ inputs.node_image }}
        run: |
          case "$PERL_NODE_IMAGE" in
            *@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "Base image must be digest-pinned." >&2; exit 1 ;;
          esac
      - name: Verify candidate
        run: |
          npm test
          npm run runtime:verify
          npm run verify:deployment
      - name: Authenticate to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish immutable candidate
        env:
          PERL_NODE_IMAGE: ${{ inputs.node_image }}
          PERL_IMAGE: ghcr.io/${{ github.repository }}:candidate-${{ github.sha }}
        run: |
          PERL_IMAGE=$(printf '%s' "$PERL_IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build --build-arg "PERL_NODE_IMAGE=$PERL_NODE_IMAGE" -f deploy/Containerfile -t "$PERL_IMAGE" .
          docker push "$PERL_IMAGE"
